<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="50%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#170b2c"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0095ff"/>
      <stop offset="35%" stop-color="#38e8ff"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ff3b5c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7af0ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse { animation: pulseAnim 3.5s ease-in-out infinite; }
      .twinkle1 { animation: twinkle 2.8s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 3.6s ease-in-out infinite 1.2s; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50% { opacity: 0.95; transform: scale(1.2); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Main Card -->
  <rect x="4" y="4" width="1192" height="312" rx="26" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="3"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#38e8ff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="180" cy="90" r="95" fill="#0095ff" opacity="0.12" filter="url(#glow)" class="pulse"/>
  <circle cx="1020" cy="220" r="110" fill="#c084fc" opacity="0.12" filter="url(#glow)" class="pulse"/>

  <!-- Animated Stars -->
  <circle cx="95" cy="64" r="3" fill="#38e8ff" class="twinkle1"/>
  <circle cx="1090" cy="58" r="3.5" fill="#ffd60a" class="twinkle2"/>
  <circle cx="1040" cy="260" r="2.5" fill="#38e8ff" class="twinkle1"/>
  <circle cx="140" cy="255" r="3" fill="#c084fc" class="twinkle2"/>

  <!-- Top Terminal Badge -->
  <rect x="410" y="34" width="380" height="32" rx="16" fill="#060e1a" fill-opacity="0.85" stroke="#38e8ff" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="432" cy="50" r="5" fill="#ff3b5c"/>
  <circle cx="448" cy="50" r="5" fill="#ffd60a"/>
  <circle cx="464" cy="50" r="5" fill="#2ee585"/>
  <text x="612" y="55" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#7af0ff">~/omarchy-linux $ fastfetch</text>

  <!-- Main Name & Title -->
  <g filter="url(#glow)">
    <text x="600" y="142" text-anchor="middle" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="56" font-weight="900" fill="url(#titleGrad)" letter-spacing="6">ENİS ÖZEN</text>
  </g>

  <text x="600" y="182" text-anchor="middle" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="16" font-weight="700" fill="#38e8ff" letter-spacing="5.5">ARCH LINUX  •  OMARCHY  •  HYPRLAND  •  C++17  •  QT6 / QML</text>

  <!-- Accent Gradient Divider -->
  <rect x="330" y="204" width="540" height="4" rx="2" fill="url(#neonBorder)" class="pulse"/>

  <!-- Feature Pills -->
  <g transform="translate(215, 232)">
    <rect x="0" y="0" width="235" height="40" rx="20" fill="#0a1628" stroke="#0095ff" stroke-width="1.5"/>
    <text x="117" y="25" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#f0f7ff">📺 Plus TV Smart Hub</text>

    <rect x="260" y="0" width="245" height="40" rx="20" fill="#0a1628" stroke="#38e8ff" stroke-width="1.5"/>
    <text x="382" y="25" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#f0f7ff">🍄 The Smurfs Theme</text>

    <rect x="530" y="0" width="240" height="40" rx="20" fill="#0a1628" stroke="#c084fc" stroke-width="1.5"/>
    <text x="650" y="25" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#f0f7ff">🎬 Digiturk × beIN Theme</text>
  </g>
</svg>
